<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9ece8">
<meta name="description" content="Eine persönliche Rezeptsammlung.">
<title>Rezepte</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231b3fb0'/%3E%3Cg fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M7 5v14M7 12h3M10 5v14'/%3E%3Cpath d='M15.5 5v6a2.5 2.5 0 0 0 2.5 2.5'/%3E%3Cpath d='M18 5v14'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

<script src="config.js"></script>
<script src="recipes/list.js"></script>
<script src="assets/app.js"></script>
<script src="assets/overview.js"></script>
</head>

<body>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="index.html">
      <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M4 3v18M4 12h4M8 3v18"/><path d="M15 3v7a3 3 0 0 0 3 3h1"/><path d="M19 3v18"/>
      </svg>
      <span class="brand__text" data-site-title>Rezepte</span>
    </a>
    <div class="topbar__spacer"></div>
    <button type="button" class="iconbtn theme-toggle" aria-label="Hell / dunkel umschalten">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
      </svg>
    </button>
  </div>
</header>

<main>
  <div class="wrap">

    <div class="masthead">
      <span class="masthead__eyebrow tag-label">Die Sammlung</span>
      <h1 class="masthead__title" data-site-title>Rezepte</h1>
      <p class="masthead__tagline" data-site-tagline></p>

      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <label class="sr-only" for="search">Rezepte durchsuchen</label>
        <input id="search" class="search__field" type="search" placeholder="Gericht, Zutat oder Schlagwort suchen…" autocomplete="off" spellcheck="false">
        <kbd class="search__key">/</kbd>
      </div>
    </div>

    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Nach Kategorie filtern"></div>
      <div class="toolbar__right">
        <span class="count" id="count" role="status" aria-live="polite"></span>
        <label class="sr-only" for="sort">Rezepte sortieren</label>
        <select class="select" id="sort">
          <option value="newest">Neueste</option>
          <option value="az">A–Z</option>
          <option value="quickest">Schnellste</option>
          <option value="favorites">Favoriten</option>
        </select>
        <button type="button" class="linkbtn" data-random>Überrasch mich</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <footer class="footer">
      <p data-site-footer></p>
      <p class="tag-label">Drücke / zum Suchen</p>
    </footer>

  </div>
</main>

</body>
</html>
